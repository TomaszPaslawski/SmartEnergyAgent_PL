[project]
name = "smartenergyagent-pl"
version = "0.1.0"
description = "Smart Energy Agent for Polish market with MLOps practices"
authors = [
    {name = "Tomasz",email = "xxx@gmail.com"}
]
license = {text = "MIT"}
#readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "python-telegram-bot (>=22.6,<23.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "openmeteo-requests (>=1.1.0,<2.0.0)",
    "requests-cache (>=1.2.1,<2.0.0)",
    "retry-requests (>=2.0.0,<3.0.0)",
    "pandas-stubs (>=3.0.0,<3.1.0)"
]

[tool.poetry] # <--- To jest sekcja tool.poetry
packages = [{include = "src"}] # <--- TUTAJ JEST PRAWIDŁOWA DEKLARACJA

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
